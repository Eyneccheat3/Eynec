<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eynec Ultimate Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@300;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================
           ЦВЕТОВЫЕ СЕКЦИИ И ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
           ========================================== */
        :root {
            --bg-deep: #050508;
            /* Секция 1: Шапка (Синий неон) */
            --header-bg: rgba(10, 20, 40, 0.8);
            --header-accent: #00d4ff;
            /* Секция 2: Чат (Зеленый неон) */
            --chat-bg: rgba(10, 25, 15, 0.6);
            --chat-accent: #00ff88;
            /* Секция 3: Кнопки (Золотой/Оранжевый) */
            --btn-accent: #ffcc00;
            --btn-bg: rgba(40, 35, 10, 0.5);
            /* Секция 4: Ввод (Фиолетовый) */
            --input-bg: rgba(30, 10, 40, 0.7);
            --input-accent: #cc00ff;
            
            --text-main: #e0e6ed;
            --font-main: 'Exo 2', sans-serif;
            --font-logo: 'Orbitron', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* ГЛАВНЫЙ КОНТЕЙНЕР */
        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 95%;
            max-width: 1000px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* --- СЕКЦИЯ 1: HEADER (BLUE) --- */
        .header {
            background: var(--header-bg);
            padding: 25px 40px;
            border-bottom: 2px solid var(--header-accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.2);
        }

        .logo {
            font-family: var(--font-logo);
            font-size: 2rem;
            color: var(--header-accent);
            text-shadow: 0 0 15px var(--header-accent);
            letter-spacing: 4px;
        }

        .system-status {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--header-accent);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
        }

        .blink-dot {
            width: 10px;
            height: 10px;
            background: var(--header-accent);
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        /* --- СЕКЦИЯ 2: CHAT AREA (GREEN) --- */
        .chat-viewport {
            flex: 1;
            background: var(--chat-bg);
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scrollbar-width: thin;
            scrollbar-color: var(--chat-accent) transparent;
        }

        .chat-viewport::-webkit-scrollbar { width: 6px; }
        .chat-viewport::-webkit-scrollbar-thumb { background: var(--chat-accent); border-radius: 10px; }

        .msg {
            max-width: 75%;
            padding: 18px 25px;
            border-radius: 20px;
            font-size: 1rem;
            line-height: 1.6;
            position: relative;
            animation: slideIn 0.4s ease;
        }

        .msg.ai {
            align-self: flex-start;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--chat-accent);
            color: #fff;
            border-bottom-left-radius: 2px;
            box-shadow: inset 0 0 15px rgba(0, 255, 136, 0.1);
        }

        .msg.user {
            align-self: flex-end;
            background: #1a1d24;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom-right-radius: 2px;
        }

        /* --- СЕКЦИЯ 3: QUICK ACTIONS (GOLD) --- */
        .quick-actions {
            background: var(--btn-bg);
            padding: 15px 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            border-top: 1px solid rgba(255, 204, 0, 0.2);
        }

        .q-btn {
            background: transparent;
            border: 1px solid var(--btn-accent);
            color: var(--btn-accent);
            padding: 8px 18px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: 0.3s;
        }

        .q-btn:hover {
            background: var(--btn-accent);
            color: #000;
            box-shadow: 0 0 20px var(--btn-accent);
        }

        /* --- СЕКЦИЯ 4: INPUT (PURPLE) --- */
        .input-zone {
            background: var(--input-bg);
            padding: 25px 40px;
            border-top: 2px solid var(--input-accent);
            display: flex;
            gap: 20px;
        }

        .main-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--input-accent);
            border-radius: 15px;
            padding: 15px 25px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .main-input:focus {
            box-shadow: 0 0 15px var(--input-accent);
        }

        .send-btn {
            background: var(--input-accent);
            color: #fff;
            border: none;
            padding: 0 35px;
            border-radius: 15px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .send-btn:hover {
            filter: brightness(1.2);
            transform: scale(1.05);
            box-shadow: 0 0 25px var(--input-accent);
        }

        /* АНИМАЦИИ */
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .typing { display: flex; gap: 5px; padding: 10px; }
        .dot { width: 8px; height: 8px; background: var(--chat-accent); border-radius: 50%; animation: bounce 1.4s infinite; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <div class="main-wrapper">
        <!-- Шапка -->
        <header class="header">
            <div class="logo">EYNEC</div>
            <div class="system-status">
                <div class="blink-dot"></div>
                <span>CORE_V2.5_ACTIVE</span>
            </div>
        </header>

        <!-- Чат -->
        <div class="chat-viewport" id="chat-box">
            <div class="msg ai">
                Система инициализирована. Я — ИИ проекта <b>Eynec</b>. <br>
                Мои модули обновлены. Я знаю всё о <b>Standoff 2, Brawl Stars</b>, наших ценах и функциях обхода бана. Жду твоего запроса.
            </div>
        </div>

        <!-- Кнопки -->
        <div class="quick-actions">
            <button class="q-btn" onclick="ask('Цены на подписки')">💰 ТАРИФЫ</button>
            <button class="q-btn" onclick="ask('Функции софта')">⚙️ ФУНКЦИОНАЛ</button>
            <button class="q-btn" onclick="ask('Читы на Standoff 2')">🔫 STANDOFF 2</button>
            <button class="q-btn" onclick="ask('Моды на Brawl Stars')">🌵 BRAWL STARS</button>
            <button class="q-btn" onclick="ask('Как не получить бан')">🛡️ ЗАЩИТА</button>
        </div>

        <!-- Ввод -->
        <div class="input-zone">
            <input type="text" id="user-input" class="main-input" placeholder="Введите команду или вопрос..." autocomplete="off">
            <button id="send-btn" class="send-btn">EXECUTE</button>
        </div>
    </div>

    <!-- СКРИПТЫ -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.js"></script>

    <script>
        /* 1. ПАРТИКЛЫ (УВЕЛИЧЕНО КОЛИЧЕСТВО) */
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 150, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": ["#00d4ff", "#00ff88", "#cc00ff"] },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.4 },
                "size": { "value": 2, "random": true },
                "line_linked": { "enable": true, "distance": 120, "color": "#ffffff", "opacity": 0.1, "width": 1 },
                "move": { "enable": true, "speed": 2, "random": true }
            },
            "interactivity": {
                "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" } }
            }
        });

        /* 2. БАЗА ДАННЫХ (ЦЕНЫ, ИГРЫ, ФУНКЦИИ) */
        const eynecData = [
            {
                title: "Прайс-лист подписок",
                tags: ["цена", "стоимость", "купить", "подписка", "деньги", "тарифы", "прайс"],
                content: "Актуальные цены Eynec:<br>• <b>7 дней</b> — 500₸<br>• <b>30 дней</b> — 1500₸<br>• <b>Навсегда</b> — 5000₸<br>Оплата: Kaspi, Crypto."
            },
            {
                title: "Функционал системы",
                tags: ["функции", "возможности", "что умеет", "фишки", "функционал"],
                content: "Eynec Core включает:<br>1. <b>Cloud Skinchanger</b> (все скины/ножи).<br>2. <b>Bypass Engine</b> (обход античита).<br>3. <b>Log Cleaner</b> (удаление следов).<br>4. Работа без Root."
            },
            {
                title: "Модуль Standoff 2",
                tags: ["стендофф", "standoff", "скины", "ножи", "скрипт", "ст2"],
                content: "Для Standoff 2 доступен скинчейнджер v0.28.0+. Визуальная подмена скинов, перчаток и ножей. Скрипт оптимизирован под слабые устройства."
            },
            {
                title: "Модуль Brawl Stars",
                tags: ["бравл", "brawl", "бс", "мод", "приватка"],
                content: "В Brawl Stars доступен доступ к приватным серверам и визуальные моды на скины в оригинале. Все бойцы открыты сразу."
            },
            {
                title: "Безопасность и Бан",
                tags: ["бан", "обход", "защита", "твинк", "безопасность"],
                content: "Чтобы избежать детекта: используйте софт только на вторых аккаунтах (твинках) и не забывайте прожимать 'Clear Logs' в меню Eynec перед выходом."
            }
        ];

        /* 3. ЛОГИКА ИИ */
        const fuse = new Fuse(eynecData, { keys: ['tags', 'title'], threshold: 0.3 });
        const box = document.getElementById('chat-box');
        const input = document.getElementById('user-input');

        function addMessage(type, text) {
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.innerHTML = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function process(query) {
            if (!query) return;
            addMessage('user', query);

            // Индикатор печати
            const t = document.createElement('div');
            t.className = 'msg ai typing';
            t.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
            box.appendChild(t);
            box.scrollTop = box.scrollHeight;

            setTimeout(() => {
                t.remove();
                const res = fuse.search(query);
                if (res.length > 0) {
                    const item = res[0].item;
                    addMessage('ai', `<b>${item.title}:</b><br>${item.content}`);
                } else {
                    addMessage('ai', "Запрос не распознан. Попробуйте ключевые слова: <b>цены, функции, Standoff, Brawl.</b>");
                }
            }, 800);
        }

        document.getElementById('send-btn').onclick = () => { process(input.value); input.value = ''; };
        input.onkeydown = (e) => { if (e.key === 'Enter') { process(input.value); input.value = ''; } };
        function ask(txt) { process(txt); }
    </script>
</body>
</html>
